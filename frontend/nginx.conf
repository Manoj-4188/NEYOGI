server {
    listen 80;

    # Docker's embedded DNS. Required for the runtime re-resolution below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves clients on stale JS.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API so the browser sees one origin and CORS is a non-issue.
    #
    # proxy_pass goes through a variable deliberately. With a literal hostname
    # nginx resolves it once at start-up and caches the address forever, so the
    # next time the backend container is recreated it gets a new IP and every
    # API call 502s until nginx itself is restarted. A variable forces
    # re-resolution per request against Docker's embedded DNS.
    location /api/ {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        set $health_upstream http://backend:8000/health;
        proxy_pass $health_upstream;
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
