# ==========================================================================
# NEYOGI -- Baseline regional yields and demand
#
#   Total Projected Volume (MT) = Classified Area (ha) x Baseline Yield (MT/ha)
#
# READ THIS BEFORE EDITING
# ------------------------
# The yield constant is the single multiplier that converts a measured area
# into a production claim, and the demand constant is what that production is
# judged against. Both propagate directly into oversupply warnings shown to
# farmers, so neither may be guessed.
#
# An entry only takes effect when `verified: true`. While it is false,
# `ml_pipeline.supply_estimation` refuses to compute a volume for that crop and
# the API returns `YIELD_BASELINE_UNAVAILABLE`, which the UI renders as an
# explicit status. Classified area is still reported -- it is measured. Only
# the derived tonnage is withheld.
#
# HOW TO FILL AN ENTRY
# --------------------
# 1. Take the figure from a citable official release. In order of preference:
#      * Karnataka Department of Horticulture, district-wise area & production
#        statistics (https://horticulture.karnataka.gov.in)
#      * Directorate of Economics & Statistics, Karnataka -- district at a
#        glance / season and crop reports
#      * National Horticulture Board, "Horticultural Statistics at a Glance"
#        (state-level; use only when no district figure exists)
# 2. Compute yield as (production MT / area ha) for that district and crop, for
#    the stated year. Do not average across unrelated years.
# 3. Fill `value_mt_ha`, `source`, `source_url`, `reference_year`.
# 4. Set `verified: true` only after a second person has checked the figure
#    against the cited document.
#
# District entries override `defaults`. A district with its own verified value
# uses it; otherwise the crop's default applies, and if that is unverified too,
# the volume is reported as unavailable.
#
# Fallow/Non-Crop deliberately has no yield: it produces nothing.
#
# UNITS
# -----
# One metric tonne (t) is one MT, so `value_mt_ha` and a "yield in t/ha" figure
# are the same number and no conversion is applied.
#
# `demand_t_per_week` is regional absorption -- roughly what the district's
# markets clear in a normal week. It is the *fallback* denominator for the
# oversupply ratio, used only when AGMARKNET has published no observed arrival
# tonnage for the window. Observed arrivals are always preferred: they are a
# measurement, this is a planning constant. Any ratio the API returns names
# which of the two produced it.
# ==========================================================================

schema_version: 2

units:
  yield: "MT/ha"          # metric tonnes per hectare (same as t/ha)
  area: "ha"
  volume: "MT"
  demand: "MT/week"

# Applied when a district has no verified override of its own.
defaults:
  Tomato:
    value_mt_ha: 25.0
    demand_t_per_week: 500.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023
    notes: >-
      State-level average supplied by the operator. Karnataka is a leading
      tomato producer and Kolar is its largest single market; the irrigated
      Kolar belt runs above this state average, so a district override taken
      from the district-wise production tables would sharpen any Kolar figure.

  Onion:
    value_mt_ha: 15.0
    demand_t_per_week: 300.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023
    notes: >-
      State-level average across seasons. Kharif and rabi onion yields differ
      materially and this platform does not split by season, so a
      single-season projection carries more error than the constant suggests.

  Potato:
    value_mt_ha: 20.0
    demand_t_per_week: 200.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023
    notes: >-
      Hassan and Chikkamagaluru dominate potato in this belt. Late-blight years
      depress yield sharply, so a multi-year official figure is preferable to
      any single anomalous season.

  Leafy Greens:
    value_mt_ha: 10.0
    demand_t_per_week: 150.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023
    notes: >-
      An aggregate class (amaranth, spinach, coriander, fenugreek) with several
      harvests per season, so any single yield constant is coarse by
      construction. Treat the resulting volume as indicative.

  Fallow/Non-Crop:
    value_mt_ha: 0.0
    demand_t_per_week: 0.0
    verified: true
    source: "Definitional -- fallow and non-crop land has no harvested output."
    source_url: ""
    reference_year: null
    notes: >-
      The one entry that needs no external citation. Present so that the class
      is handled explicitly rather than falling through as missing data.

# Per-district overrides. Same field shape as `defaults`. Left empty: the
# operator supplied state-level figures, and splitting them into per-district
# variation would manufacture precision the source does not contain.
districts:
  Kolar: {}
  Chikkaballapur: {}
  Bengaluru Rural: {}
  Tumakuru: {}
  Hassan: {}
  Mandya: {}
  Mysuru: {}
  Belagavi: {}
