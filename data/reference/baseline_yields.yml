# ==========================================================================
# NEYOGI -- Baseline yields, market absorption and harvest spread
#
#   Projected volume (MT)  = Classified area (ha) x Baseline yield (MT/ha)
#   Weekly arrival (MT/wk) = Projected volume / Harvest spread (weeks)
#   Oversupply ratio       = Weekly arrival / Weekly absorption
#
# READ THIS BEFORE EDITING
# ------------------------
# These constants turn a measured area into a claim about a market, and that
# claim reaches farmers deciding when to harvest. None may be guessed. An
# entry takes effect only when its `verified` flag is true; while false, the
# API withholds the derived figure and says so.
#
# THE THREE CONSTANTS, AND WHY EACH EXISTS
# ----------------------------------------
# `value_mt_ha` -- yield. Converts hectares to tonnes.
#
# `absorption_t_per_week` -- what a district's markets actually clear in a
#   week. This is the *fallback* denominator for the oversupply ratio, used
#   only when AGMARKNET has published no observed arrivals for the window.
#   Observed arrivals are always preferred: they are a measurement, this is a
#   reference figure, and any ratio the API returns names which one produced
#   it.
#
#   It must be a whole-district throughput, not one trader's or one day's lot.
#   An order-of-magnitude error here moves the oversupply ratio by the same
#   order, and the first version of this file was wrong by roughly 38x for
#   exactly that reason.
#
# `harvest_spread_weeks` -- over how many weeks one cycle's harvest actually
#   reaches market. Without it the ratio divides a whole harvest (a stock) by
#   one window's absorption (a flow) and is inflated by however many weeks the
#   harvest really spans. Dividing projected volume by this converts it into a
#   weekly arrival rate, so both sides of the ratio are flows.
#
# SOURCING
# --------
# Prefer, in order: Karnataka Department of Horticulture district-wise area and
# production statistics; Directorate of Economics & Statistics, Karnataka; the
# specific APMC's own annual returns; National Horticulture Board.
#
# Set a `verified` flag to true only after a second person has checked the
# figure against the cited document.
#
# UNITS: one metric tonne (t) is one MT, so a "t/ha" figure is a "MT/ha"
# figure and no conversion is applied.
# ==========================================================================

schema_version: 3

units:
  yield: "MT/ha"
  area: "ha"
  volume: "MT"
  absorption: "MT/week"
  harvest_spread: "weeks"

# --------------------------------------------------------------------------
# Crop defaults. Yields are the operator-supplied Horticulture Department
# figures and are in force.
#
# Absorption is deliberately NOT set at this level. Market throughput is a
# property of a particular district's mandi, not of a crop: Kolar clears
# roughly forty times more tomato than a district with no major yard. A single
# state-wide default would be wrong nearly everywhere it applied, so a district
# without a sourced figure withholds the ratio rather than borrowing one.
# --------------------------------------------------------------------------
defaults:
  Tomato:
    value_mt_ha: 25.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023

    absorption_t_per_week: null
    absorption_verified: false
    absorption_source: ""

    # Indeterminate varieties are picked repeatedly rather than cut once.
    harvest_spread_weeks: 8.0
    harvest_spread_verified: true
    harvest_spread_source: >-
      Tomato in India is transplanted for a harvest running roughly two to
      three months, picked over repeated rounds rather than in a single cut.

  Onion:
    value_mt_ha: 15.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023

    absorption_t_per_week: null
    absorption_verified: false
    absorption_source: ""

    harvest_spread_weeks: 3.0
    harvest_spread_verified: true
    harvest_spread_source: >-
      Onion lifts over a one-to-four week window after a 70-100 day growing
      period; three weeks is the midpoint of that harvest window.

  Potato:
    value_mt_ha: 20.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023

    absorption_t_per_week: null
    absorption_verified: false
    absorption_source: ""

    harvest_spread_weeks: 3.0
    harvest_spread_verified: true
    harvest_spread_source: >-
      Potato is lifted over a two-to-four week window following a 90-120 day
      growing period.

  Leafy Greens:
    value_mt_ha: 10.0
    verified: true
    source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
    source_url: "https://horticulture.karnataka.gov.in"
    reference_year: 2023

    absorption_t_per_week: null
    absorption_verified: false
    absorption_source: ""

    harvest_spread_weeks: 2.0
    harvest_spread_verified: true
    harvest_spread_source: >-
      Leafy greens run a 30-45 day cycle and are cut over roughly a fortnight.

  Fallow/Non-Crop:
    value_mt_ha: 0.0
    verified: true
    source: "Definitional -- fallow and non-crop land has no harvested output."
    source_url: ""
    reference_year: null
    absorption_t_per_week: 0.0
    absorption_verified: true
    absorption_source: "Definitional."
    harvest_spread_weeks: 1.0
    harvest_spread_verified: true
    harvest_spread_source: "Definitional; never used."

# --------------------------------------------------------------------------
# District overrides. Absorption belongs here, because it is a fact about a
# particular market rather than about a crop.
# --------------------------------------------------------------------------
districts:
  Kolar:
    Tomato:
      value_mt_ha: 25.0
      verified: true
      source: "Karnataka State Horticulture Department, 2023 (operator-supplied)"
      source_url: "https://horticulture.karnataka.gov.in"
      reference_year: 2023

      # Kolar APMC is South Asia's second-largest tomato market. Reported
      # throughput is about 1,000,000 tonnes a year, peaking above 4,000
      # tonnes a day (roughly 28,000 MT/week) across the May-August season.
      #
      # The annual average is used rather than the peak: absorption should
      # describe a normal week, and anchoring on the peak would understate
      # oversupply for most of the year.
      absorption_t_per_week: 19231.0
      absorption_verified: true
      absorption_source: >-
        Kolar APMC reported throughput of approximately 1,000,000 tonnes per
        year, i.e. about 19,231 MT/week averaged over 52 weeks, with
        peak-season arrivals above 4,000 tonnes/day. South Asia's
        second-largest tomato market.
      absorption_reference_year: 2023

  # Yeshwanthpur APMC in Bengaluru handles about 3,600 tonnes of onion AND
  # potato combined per day between August and October, and is one of India's
  # largest markets for both. The source does not split that figure by crop,
  # and splitting it here would invent the division, so no per-crop absorption
  # is recorded: both crops withhold their ratio until a split figure is taken
  # from the APMC's own returns.
  Bengaluru Rural: {}

  Chikkaballapur: {}
  Tumakuru: {}
  Hassan: {}
  Mandya: {}
  Mysuru: {}
  Belagavi: {}
